[project]
name = "bluebird"
version = "0.1.0"
description = "파랑새 업무망 backend (적재·신호·진단·공개 반영)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.32",
]

[project.scripts]
bluebird = "bluebird.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bluebird"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
