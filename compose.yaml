# 파랑새: 백엔드 API + 콘솔. DB = 서버 1개(.env BB_DB_URL). 처리 작업 = 명령 실행.
#   팀원 테스트 : ./demo.sh init && ./demo.sh cycle      (전부 Docker)
#   개발        : eval "$(./demo.sh env)" 후 uv run / npm run dev (README.md)
# 키·DB 접속 = .env(.env.example 참고). 런타임 파일(원본 seed·익명화 키·콘솔 토큰) = .runtime/
name: bluebird

volumes:
  signals: {}

x-backend-env: &backend-env
  BB_DSN: ${BB_DB_URL:?set BB_DB_URL in .env (DB 서버)}
  BB_MASTER_DSN: ${BB_DB_URL}
  BB_SOURCES: /config/sources.toml
  BB_CONTEST_SOURCES: /config/contest-sources.toml
  BB_SEED_DIR: /seed
  BB_SIGNAL_DIR: /signals
  BB_ANON_SECRET: /secrets/anon_secret
  BB_LLM_PROVIDER: ${BB_LLM_PROVIDER:-}
  BB_LLM_MODEL: ${BB_LLM_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
  NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
  NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
  KIPRIS_PLUS_KEY: ${KIPRIS_PLUS_KEY:-}
  LAW_OC: ${LAW_OC:-}
  BIZINFO_KEY: ${BIZINFO_KEY:-}
  SEOUL_OPENAPI_KEY: ${SEOUL_OPENAPI_KEY:-}
  GG_OPENAPI_KEY: ${GG_OPENAPI_KEY:-}
  BB_ACRC_CALL_BUDGET: ${BB_ACRC_CALL_BUDGET:-9000}

services:
  # 처리 작업(적재·카드·신호·내보내기 등). 리스너 없음. ./demo.sh job <명령>
  jobs:
    image: bluebird/pipeline:dev
    build: ./pipeline
    profiles: ["jobs"]
    environment: *backend-env
    volumes:
      - ./deploy/local/sources.toml:/config/sources.toml:ro
      - ./deploy/local/contest-sources.toml:/config/contest-sources.toml:ro
      - ./deploy/local/science-contest-sources.toml:/config/science-contest-sources.toml:ro
      - ./deploy/local/design-contest-sources.toml:/config/design-contest-sources.toml:ro
      - ./deploy/local/api-sources.toml:/config/api-sources.toml:ro
      - ./.runtime/seed:/seed:ro
      - ./.runtime/secrets:/secrets:ro
      - ./.runtime/export:/export
      - signals:/signals

  api:
    image: bluebird/pipeline:dev
    build: ./pipeline
    entrypoint: ["python", "-m", "bluebird.api"]
    environment:
      BB_DSN: ${BB_DB_URL:?set BB_DB_URL in .env (DB 서버)}
      BB_API_USERS: /secrets/console_users.json
    ports: ["127.0.0.1:${BB_API_PORT:-8000}:8000"]
    volumes:
      - ./.runtime/console/console_users.json:/secrets/console_users.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  console:
    image: bluebird/console:dev
    build: ./web/console
    depends_on: { api: { condition: service_healthy } }
    environment:
      BB_API_URL: http://api:8000
    ports: ["127.0.0.1:${BB_CONSOLE_PORT:-3001}:3000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
