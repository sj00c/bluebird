# DMZ 외부 연계 포워드 프록시(시험). 업무망 backend-jobs만 쓴다.
# 화이트리스트는 pipeline/bluebird/egress.py ALLOWED_HOSTS와 같아야 한다(verify.sh가 비교).
http_port 3128

acl bb_whitelist dstdomain .data.go.kr .law.go.kr .kipris.or.kr .k-startup.go.kr .bizinfo.go.kr
acl bb_whitelist dstdomain openapi.naver.com api.openai.com api.anthropic.com
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow bb_whitelist
http_access deny all

# 캐시 없음. 접근 로그는 파일(이미지 entrypoint가 docker logs로 내보냄) — 감사 보존 대상
cache deny all
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
via off
forwarded_for delete
