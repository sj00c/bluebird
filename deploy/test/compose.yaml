# 파랑새 시험 배포 — 단일 호스트에서 확정 망구성(docs/diagrams/architecture.html)을 재현한다.
#
#   사용자 Zone ── edge_net ── nginx ─┐
#   DMZ(서비스)        dmz_net : nginx, portal, publish-db        (internal)
#   업무망 → DMZ 반영  push_net: backend-jobs, publish-db        (internal, 연결은 backend-jobs가 연다)
#   업무망             biz_net : backend-jobs, core-db            (internal)
#   업무망 → DMZ 연계  egress_net: backend-jobs, proxy            (internal)
#   DMZ(외부 연계)     inet_net: proxy                            (인터넷)
#   업무망 콘솔        console_net: console-gw, console, backend-api (internal)
#   관리자 단말        admin_net : console-gw → 127.0.0.1:8090     (이 호스트에서만)
#
# - 업무망(core-db, backend-jobs)으로 들어오는 경로가 없다. DMZ 컨테이너는 biz_net에 붙지 않는다.
# - backend-jobs는 인터넷에 직접 못 나가고 프록시(화이트리스트)만 쓴다.
# - backend-api·console은 internal 망에만 있어 외부 연결이 없다. 관리자 접속은 console-gw(127.0.0.1)로만.
# - publish-db 역할: bb_migrator(스키마) / bb_publisher(push) / bb_inbox_reader(이의 pull) / bb_portal(읽기+이의 INSERT).
#   superuser(bluebird)는 원격 로그인 불가.
# 운영 배포는 docs/DEPLOYMENT.md 참고.

name: bluebird-test

networks:
  edge_net: {}
  dmz_net: { internal: true }
  push_net: { internal: true }
  biz_net: { internal: true }
  egress_net: { internal: true }
  inet_net: {}
  console_net: { internal: true }
  admin_net: {}

volumes:
  core_db: {}
  publish_db: {}
  signals: {}

x-backend-env: &backend-env
  BB_DSN: postgresql://bluebird:${CORE_DB_PASSWORD}@core-db:5432/bluebird_core
  BB_PUBLISH_DSN: postgresql://bb_publisher:${PUBLISHER_DB_PASSWORD}@publish-db:5432/bluebird_publish
  BB_PUBLISH_MIGRATOR_DSN: postgresql://bb_migrator:${MIGRATOR_DB_PASSWORD}@publish-db:5432/bluebird_publish
  BB_INBOX_DSN: postgresql://bb_inbox_reader:${INBOX_DB_PASSWORD}@publish-db:5432/bluebird_publish
  BB_SOURCES: /config/sources.toml
  BB_SEED_DIR: /seed
  BB_SIGNAL_DIR: /signals
  BB_ANON_SECRET: /secrets/anon_secret
  BLUEBIRD_EGRESS_PROXY: http://proxy:3128
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
  NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
  NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
  KIPRIS_PLUS_KEY: ${KIPRIS_PLUS_KEY:-}
  LAW_OC: ${LAW_OC:-}
  BIZINFO_KEY: ${BIZINFO_KEY:-}

services:
  # ------------------------------------------------------------------ 업무망
  core-db:
    image: pgvector/pgvector:pg16
    networks: [biz_net]
    environment:
      POSTGRES_DB: bluebird_core
      POSTGRES_USER: bluebird
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?set in .env}
    volumes: [core_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluebird -d bluebird_core"]
      interval: 5s
      retries: 20

  # 배치 작업(수집·신호·진단·push·pull). 리스너 없음. `docker compose run --rm backend-jobs <명령>`
  backend-jobs:
    image: bluebird/pipeline:${BB_VERSION:-dev}
    build: ../../pipeline
    pull_policy: never
    restart: "no"
    profiles: ["jobs"]
    networks: [biz_net, push_net, egress_net]
    depends_on:
      core-db: { condition: service_healthy }
      publish-db: { condition: service_healthy }
    environment: *backend-env
    volumes:
      - ./sources.toml:/config/sources.toml:ro
      - ./.runtime/seed:/seed:ro
      - ./.runtime/secrets:/secrets:ro
      - signals:/signals

  # 관리자 콘솔용 API(검토 큐·2인 독립 코딩·승인·이의 처리). core-db만 쓴다. 외부 연결 없음.
  backend-api:
    image: bluebird/pipeline:${BB_VERSION:-dev}
    pull_policy: never
    entrypoint: ["python", "-m", "bluebird.api"]
    networks: [biz_net, console_net]
    depends_on:
      core-db: { condition: service_healthy }
    environment:
      BB_DSN: postgresql://bb_api:${API_DB_PASSWORD}@core-db:5432/bluebird_core   # 최소 권한(0008)
      BB_API_USERS: /secrets/console_users.json
    volumes:
      - ./.runtime/console/console_users.json:/secrets/console_users.json:ro
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  console:
    image: bluebird/console:${BB_VERSION:-dev}
    build: ../../web/console
    networks: [console_net]
    depends_on: { backend-api: { condition: service_healthy } }
    environment:
      BB_API_URL: http://backend-api:8000
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  console-gw:
    image: nginx:1.28-alpine
    networks: [console_net, admin_net]
    depends_on: [console]
    ports: ["127.0.0.1:${BB_CONSOLE_PORT:-8090}:8090"]
    volumes:
      - ./console-gw.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ------------------------------------------------------------------ DMZ(외부 연계)
  proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029  # squid 6.13
    networks: [egress_net, inet_net]
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "squid -k check"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------------ DMZ(서비스)
  publish-db:
    image: pgvector/pgvector:pg16
    networks: [dmz_net, push_net]
    environment:
      POSTGRES_DB: bluebird_publish
      POSTGRES_USER: bluebird
      POSTGRES_PASSWORD: ${PUBLISH_DB_PASSWORD:?set in .env}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set in .env}
      PUBLISHER_DB_PASSWORD: ${PUBLISHER_DB_PASSWORD:?set in .env}
      INBOX_DB_PASSWORD: ${INBOX_DB_PASSWORD:?set in .env}
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:?set in .env}
    volumes:
      - publish_db:/var/lib/postgresql/data
      - ./initdb/publish:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluebird -d bluebird_publish"]
      interval: 5s
      retries: 20

  portal:
    image: bluebird/portal:${BB_VERSION:-dev}
    build: ../../web/portal
    networks: [dmz_net]
    depends_on: { publish-db: { condition: service_healthy } }
    environment:
      PORTAL_DATABASE_URL: postgresql://bb_portal:${PORTAL_DB_PASSWORD}@publish-db:5432/bluebird_publish
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    networks: [dmz_net, edge_net]
    depends_on: [portal]
    ports: ["${BB_HTTP_PORT:-8080}:8080"]
    volumes:
      - ../nginx/bluebird-common.conf:/etc/nginx/snippets/bluebird-common.conf:ro
      - ../nginx/bluebird-proxy.conf:/etc/nginx/snippets/bluebird-proxy.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
