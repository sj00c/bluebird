# 시험용: HTTP 8080. 운영은 deploy/prod/nginx/bluebird.conf(TLS) 사용.
limit_req_zone $binary_remote_addr zone=bb_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bb_page:10m rate=30r/s;

upstream bb_portal {
    server portal:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    include /etc/nginx/snippets/bluebird-common.conf;
}
