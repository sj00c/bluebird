# 원본 아이디어 소스 목록. file = seed 디렉터리 기준 상대경로. 파일 없으면 건너뛰.
#
# public_ok    : 공개 관문. true → 공개 DB 반영. policy_approved_by/at(소스 단위 정책 승인) 필수
# export_grade : 반출 관문. 외부 호출(상용 LLM·흔적 검색)에 소스 필드 전송 가능 여부
#                O = 공개 출처, 허용 필드 반출 가능 / pending = 약관·N2SF 결정 대기(기본 차단) / deny = 반출 금지
# 공개·반출 기본 보류. 정책 검토 후 승인자·승인일·허용 범위 명시
# record_kind  : 기록 종류. contest_award(수상작) / contest_submission(출품작) / public_proposal(국민·주민 제안) / improvement_proposal(직원 개선제안)
# exclude_reason: 소스 단위 제외 후보 이유(선택). certified_product(상품화 후 인증) / internal_activity(기관 내부 활동) / teaching_case(수업·교육 사례)
#                record_kind·exclude_reason·학생 대회 표시(core.contest.audience)·동일 제목 묶음 = 선별 재료
#                아이디어별 core.idea_exclusion에 "뺀다면 이 이유" 기록. 적용 이유 = 사람이 추후 선택. 필터링 없음

