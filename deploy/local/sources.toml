# 원본 아이디어 소스 목록. file은 seed 디렉터리 기준 상대경로. 파일이 없으면 건너뛴다.
#
# public_ok    : 공개 관문. true면 공개 DB로 반영된다. 반드시 policy_approved_by/at(소스 단위 정책 승인)이 있어야 한다.
# export_grade : 반출 관문. 외부 호출(상용 LLM·흔적 검색)에 이 소스 필드를 보낼 수 있는지.
#                O = 공개 출처, 허용 필드 반출 가능 / pending = 약관·N2SF 결정 대기(기본 차단) / deny = 반출 금지
# 공개·반출은 기본 보류. 실제 정책 검토 후 승인자·승인일과 허용 범위를 명시한다.
# record_kind  : 기록 종류. contest_award(수상작) / contest_submission(출품작) / public_proposal(국민·주민 제안) / improvement_proposal(직원 개선제안)
# exclude_reason: 소스 단위 제외 후보 이유(선택). certified_product(상품화 뒤 받는 인증) / internal_activity(기관 내부 활동) / teaching_case(수업·교육 사례)
#                record_kind·exclude_reason·대회의 학생 대회 표시(core.contest.audience)·같은 제목 묶음은 전부 선별 재료다.
#                아이디어마다 core.idea_exclusion에 "뺀다면 이 이유"로 쌓이고, 어떤 이유를 적용할지는 사람이 나중에 고른다. 걸러내지 않는다. docs/IDEA_POOL.md

