# OpenAPI 소스(키 필요). 수집기 = pipeline/bluebird/collect_proposals.py(제안), collect_kipris.py(KIPRIS). 실측 2026-10-13.
# 키 = .env(SEOUL_OPENAPI_KEY, DATA_GO_KR_KEY, GG_OPENAPI_KEY, KIPRIS_PLUS_KEY). 키 없음 = 수집 실패(기존 파일 유지).
# 제안자 성명·연락처·답변·첨부 미기록. 본문 내 전화·이메일·'제안자: 성명' = 고정 치환.
# 공개·반출 = 전부 보류(pending). 원본 라이선스 = 제한 없음(서울·경기), 공공데이터 이용정책(권익위).

# 28,811건(2013~2026). 접수 본문 6섹션 + 선정 정보(2,658) 조인 → award 선정/통폐합 선정.
[[source]]
id = "seoul_budget_proposals"
adapter = "mapped_contest_csv"
collector = "seoul_budget"
file = "seoul_budget_proposals.csv"
name = "서울특별시 시민참여예산사업 접수정보(열린데이터광장 OA-15412, 선정 OA-15414 조인)"
license = "이용허락범위 제한 없음"
url = "https://data.seoul.go.kr/dataList/OA-15412/A/1/datasetView.do"
layer = 2
public_ok = false
export_grade = "pending"
record_kind = "public_proposal"
topic = "서울 시민참여예산 제안사업(접수·선정)"
share = true
contest_name = "서울시 시민참여예산"
host_org = "서울특별시"
[source.columns]
key = "key"
title = "title"
year = "year"
award = "award"
category = "category"
body = ["body"]

# 국민신문고 공개제안. 연 1~3만건, 조회창 ≤1년. 건별 조회 필요 → 일 한도(개발계정 10,000) 안에서 증분 수집.
# acrc_from_year~acrc_to_year 범위를 최신 연도부터 채움. BB_ACRC_CALL_BUDGET(기본 9000)마다 1회 실행.
[[source]]
id = "acrc_open_proposals"
adapter = "mapped_contest_csv"
collector = "acrc_open_proposal"
dataset_id = "15059423"
file = "acrc_open_proposals.csv"
name = "국민권익위원회 국민신문고 공개제안(공공데이터포털 15059423)"
license = "공공데이터포털 이용정책 — 개발단계 서비스키"
url = "https://www.data.go.kr/data/15059423/openapi.do"
layer = 2
public_ok = false
export_grade = "pending"
record_kind = "public_proposal"
topic = "국민신문고 공개제안(중앙·지방 정책)"
share = true
contest_name = "국민신문고 공개제안"
host_org = "국민권익위원회"
acrc_from_year = 2015
acrc_to_year = 2026
[source.columns]
key = "key"
title = "title"
year = "year"
category = "category"
body = ["body"]

