# 시험·운영 공통 server 블록 내용.
# 선행 정의 필요: upstream bb_portal, limit_req_zone bb_api / bb_page, /etc/nginx/snippets/bluebird-proxy.conf
server_tokens off;
client_max_body_size 64k;
client_body_timeout 10s;
client_header_timeout 10s;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# 허용 메서드: 조회(GET/HEAD) + 이의 제기 접수(POST)
if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

# 이의 제기 접수: IP당 분당 5건(+5). 스팸이 DMZ inbox를 채워 업무망 pull(주기당 상한)을 밀어내지 않게.
location = /api/v1/objections {
    limit_req zone=bb_objection burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://bb_portal;
    include /etc/nginx/snippets/bluebird-proxy.conf;
}

location /api/ {
    limit_req zone=bb_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://bb_portal;
    include /etc/nginx/snippets/bluebird-proxy.conf;
}

# 헬스체크는 내부 대역에서만
location = /healthz {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://bb_portal;
    include /etc/nginx/snippets/bluebird-proxy.conf;
}

location / {
    limit_req zone=bb_page burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://bb_portal;
    include /etc/nginx/snippets/bluebird-proxy.conf;
}
