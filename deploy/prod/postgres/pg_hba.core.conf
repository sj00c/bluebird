# Z2 core DB 서버 (예: 10.20.10.21). 처리존 내부 대역에서만, SCRAM 인증.
# TYPE  DATABASE        USER              ADDRESS            METHOD
local   all             postgres                             peer
hostssl bluebird_core   bluebird          10.20.10.11/32     scram-sha-256   # z2-app (worker/importer/publisher)
hostssl bluebird_core   bluebird_console  10.20.10.11/32     scram-sha-256   # z2-app (console)
hostssl bluebird_core   bluebird_ro       10.20.10.31/32     scram-sha-256   # 백업·감사 조회
host    all             all               0.0.0.0/0          reject
