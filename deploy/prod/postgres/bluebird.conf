# postgresql.conf include (conf.d/bluebird.conf) — core·publish 공통. 메모리 값은 16GB 서버 기준.
listen_addresses = '*'            # pg_hba + 방화벽으로 제한
ssl = on
ssl_cert_file = '/etc/pki/bluebird/db.crt'
ssl_key_file  = '/etc/pki/bluebird/db.key'
password_encryption = scram-sha-256

shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 1GB        # HNSW 인덱스 빌드
work_mem = 32MB
max_connections = 100

# 감사·접속 기록 (개인정보 처리시스템 접속기록 보관 요건 대응)
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] user=%u db=%d client=%h app=%a '
log_statement = 'ddl'
log_min_duration_statement = 1000

# 백업(PITR)
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /backup/wal/%f && cp %p /backup/wal/%f'
