# Z3 publish DB 서버 (예: 172.16.30.21, DMZ 내부 DB 세그먼트). 웹서버와 importer만.
# TYPE  DATABASE          USER              ADDRESS            METHOD
local   all               postgres                             peer
hostssl bluebird_publish  bluebird          172.16.30.11/32    scram-sha-256   # z3-web (importer)
hostssl bluebird_publish  bluebird_portal   172.16.30.11/32    scram-sha-256   # z3-web (portal, SELECT only)
host    all               all               0.0.0.0/0          reject
