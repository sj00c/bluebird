# DMZ 공개용 DB 서버 (예: 172.16.30.21). 역할별로 출발지를 고정한다. superuser는 원격 로그인 불가.
# 업무망 호스트(10.20.10.11)가 연결을 연다. DMZ 쪽에서 업무망으로 여는 연결은 없다.
# TYPE  DATABASE          USER              ADDRESS            METHOD
local   all               postgres                             peer
hostssl bluebird_publish  bb_portal         172.16.30.11/32    scram-sha-256   # dmz-web (포털: publish 읽기 + inbox INSERT)
hostssl bluebird_publish  bb_publisher      10.20.10.11/32     scram-sha-256   # 업무망 (공개본 밀어넣기)
hostssl bluebird_publish  bb_inbox_reader   10.20.10.11/32     scram-sha-256   # 업무망 (이의 가져오기·삭제)
hostssl bluebird_publish  bb_migrator       10.20.10.11/32     scram-sha-256   # 업무망 (스키마 마이그레이션, 필요할 때만)
host    all               all               0.0.0.0/0          reject
