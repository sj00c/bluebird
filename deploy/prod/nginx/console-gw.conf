# 업무망 biz-app. 관리자 콘솔 앞 게이트웨이(방화벽 ④: 관리자 PC → 443만).
# 콘솔(Next.js)은 루프백 3001, backend-api는 루프백 8000에서만 받는다. 이 서버만 관리자 망에 열린다.
limit_req_zone $binary_remote_addr zone=bb_console:10m rate=10r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/pki/bluebird/console-fullchain.pem;
    ssl_certificate_key /etc/pki/bluebird/console-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 관리자 단말 대역만(기관 관리자 망으로 교체). 그 밖은 403.
    allow 10.20.99.0/24;   # <관리자 PC 대역 placeholder>
    deny all;

    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        limit_req zone=bb_console burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
