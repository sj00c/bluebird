# 운영 DMZ 웹서버 — /etc/nginx/conf.d/bluebird.conf
# 공통 location·보안헤더는 /etc/nginx/snippets/bluebird-common.conf, 프록시 헤더는 bluebird-proxy.conf
# (둘 다 저장소 deploy/nginx/ 의 같은 파일을 복사해 둔다. 시험 배포와 동일)
# WAF 뒤에 있으므로 접속자 IP를 X-Forwarded-For에서 복원한다(한도·로그가 WAF 주소로 뭉치지 않게).
# WAF 대역은 기관 WAF 장비의 출발 대역으로 바꾼다.
set_real_ip_from 192.0.2.0/24;   # <WAF 대역 placeholder>
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=bb_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bb_page:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bb_objection:10m rate=5r/m;

log_format bb_access '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" rt=$request_time';

upstream bb_portal {
    server 127.0.0.1:3000;   # portal(Node.js) — 같은 서버 루프백에서만 수신
    keepalive 16;
}

server {
    listen 80;
    server_name bluebird.example.go.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bluebird.example.go.kr;

    ssl_certificate     /etc/pki/bluebird/fullchain.pem;
    ssl_certificate_key /etc/pki/bluebird/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bb_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/bluebird.access.log bb_access;
    error_log  /var/log/nginx/bluebird.error.log warn;

    include /etc/nginx/snippets/bluebird-common.conf;   # bluebird-proxy.conf는 common 안에서 include
}
